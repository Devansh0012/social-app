services:
  postgres:
    image: postgres:16-alpine
    container_name: braventex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: braventex
      POSTGRES_PASSWORD: braventex
      POSTGRES_DB: braventex
    ports:
      - "5432:5432"
    volumes:
      - braventex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U braventex -d braventex"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: braventex-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  braventex_pgdata:
